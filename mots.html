<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Lexique — mot rare du jour</title>
<meta name="description" content="Un mot français peu connu chaque jour, avec sa définition et un exemple.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

  <nav class="site-nav">
    <a href="index.html">Expressions</a>
    <a href="mots.html" class="active">Mots rares</a>
  </nav>

  <div class="notebook" id="notebook">
    <div class="spiral" aria-hidden="true"></div>

    <header class="entry-header">
      <span class="eyebrow">Le lexique — mot rare du jour</span>
      <span class="date" id="date"></span>
    </header>

    <div class="entry-body">
      <h1 class="expression">
        <span class="circle-wrap">
          <span id="expr-text">Chargement…</span>
          <svg class="scribble" viewBox="0 0 320 120" preserveAspectRatio="none" aria-hidden="true">
            <path d="M18,60 C12,24 60,8 160,7 C270,6 306,26 302,58 C298,96 250,113 160,114 C64,115 16,98 18,62" />
          </svg>
        </span>
        <span class="nature-tag" id="nature-tag"></span>
      </h1>

      <p class="explication" id="explication"></p>

      <blockquote class="exemple">
        <span class="quote-mark">«</span>
        <span id="exemple"></span>
        <span class="quote-mark">»</span>
      </blockquote>
    </div>

    <footer class="entry-footer">
      <button id="prev" class="nav-btn" aria-label="Mot précédent">← précédent</button>
      <div class="counter-wrap">
        <span class="counter" id="counter"></span>
        <button id="today-btn" class="today-badge hidden">aujourd'hui</button>
      </div>
      <button id="next" class="nav-btn" aria-label="Mot suivant">suivant →</button>
    </footer>
  </div>

  <button id="toggle-archive" class="archive-link">Feuilleter tout le lexique (<span id="archive-count"></span> mots)</button>

  <div id="archive" class="archive hidden">
    <input type="text" id="archive-search" placeholder="Chercher un mot…" autocomplete="off">
    <ul id="archive-list"></ul>
  </div>

  <p class="colophon">Un mot rare chaque jour — le choix du jour se calcule à partir de la date, aucune connexion nécessaire.</p>

</div>

<script src="mots-data.js"></script>
<script src="mots-script.js"></script>
</body>
</html>
